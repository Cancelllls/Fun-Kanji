name: Fun Kanji Release Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'releases/**'
      - 'README.md'

jobs:
  # ── Auto-Bump Version ────────────────────────────────────────────────
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bump Patch Version
        id: bump
        run: |
          OLD_NEW=$(python3 tools/bump_version.py)
          OLD=$(echo "$OLD_NEW" | awk '{print $1}')
          NEW=$(echo "$OLD_NEW" | awk '{print $2}')
          echo "old=$OLD" >> $GITHUB_OUTPUT
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "Bumped: $OLD → $NEW"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/version.dart pubspec.yaml
          git commit -m "chore: bump version to v${NEW} [skip ci]" || exit 0
          git push origin main

  # ── Build Release APKs ────────────────────────────────────────────────
  build:
    needs: bump
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up signing (if key present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
            cat > android/key.properties << EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs & Universal APK
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APKs for Release
        run: |
          VER="${{ needs.bump.outputs.version }}"
          mkdir -p release_apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_apks/FunKanji-v${VER}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release_apks/FunKanji-v${VER}-x86_64.apk
          cp build/app/outputs/flutter-apk/app-release.apk release_apks/FunKanji-v${VER}-universal.apk

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fun-kanji-apks
          path: release_apks/

  # ── GitHub Release ───────────────────────────────────────────────────
  release:
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Set Version
        id: version
        run: |
          VER="${{ needs.bump.outputs.version }}"
          echo "tag=v${VER}" >> $GITHUB_OUTPUT
          echo "display=${VER}" >> $GITHUB_OUTPUT

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: fun-kanji-apks
          path: apks/

      - name: Generate Changelog
        id: changelog
        run: |
          CHANGELOG=$(python3 tools/gen_changelog.py "${{ steps.version.outputs.display }}")
          echo "$CHANGELOG" > /tmp/changelog.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release v${{ steps.version.outputs.display }}
          body_path: /tmp/changelog.md
          files: |
            apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

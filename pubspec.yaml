name: fun_with_kanji
description: Fun Kanji - Modern Japanese Kanji Learning App
publish_to: "none"
version: 1.0.8+10008

environment:
  sdk: ">=3.1.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.2
  provider: ^6.0.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  just_audio: ^0.10.6
  url_launcher: ^6.0.20
  path_provider: ^2.0.15
  dynamic_color: ^1.4.0
  shared_preferences: ^2.2.3
  collection: ^1.16.0
  file_picker: ^11.0.2
  flutter_file_saver: any
  home_widget: ^0.9.3
  confetti: ^0.8.0
  flutter_staggered_animations: ^1.1.1
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: any
  flutter_launcher_icons: ^0.14.4
  import_sorter: ^4.6.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/sounds/

flutter_icons:
  android: "launcher_icon"
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/icon.png"
